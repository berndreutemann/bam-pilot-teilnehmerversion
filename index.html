  Änderungen zu 1.20 (Startseite neu strukturiert, Bericht/Dankseite überarbeitet,
  Wortwahl vereinheitlicht):
  - Startseite komplett neu aufgebaut: neue Kernfakten-Zeile (60 Aussagen · 5 Werte ·
    10-15 Minuten · läuft nur im Browser) ersetzt den bisherigen "Mechanik"-Absatz.
    "Kein Richtig/Falsch" als eigene hervorgehobene Callout-Box statt Nebensatz im
    Kontext-Absatz. Anonymität & Datenschutz nach vorne gezogen (direkt nach den
    Kernfakten statt am Seitenende) und um explizite Anonymitäts-Zusage ergänzt: "es
    werden weder Name noch E-Mail-Adresse erfasst, es gibt keine Anmeldung" - das
    beantwortet die zuvor offene Frage, ob die Führungskraft erkennt, wer wie
    geantwortet hat. Füreinander-Gedanke als eigener kurzer Absatz statt im
    Kontext-Satz versteckt. "Worum es geht" gekürzt. Fünf durchgehende Fließtext-
    Absätze damit auf einen Fakten-Header plus vier knappe Blöcke reduziert.
  - Fragebogen-Hinweisbox: Wortwahl von "erlebst" auf "insgesamt wahrnimmst"
    umgestellt - Grund: Vokabular für "wie du das Umfeld einschätzt" war uneinheitlich
    (erleben/bewerten/wahrnehmen an verschiedenen Stellen), jetzt durchgängig
    "wahrnehmen" + "insgesamt" an allen drei betroffenen Stellen (Fragebogen-
    Hinweisbox, Kein-Richtig-Falsch-Box, Stärken-Überschrift).
  - Bericht: Einleitungssatz um Klarstellung ergänzt, dass eine teamweite Auswertung
    erst durch die Beratung entsteht (vorher nur in der jetzt entfallenen globalen
    Fußnote enthalten, dort aber unpassend, weil "wer antwortet" und "was wird
    bewertet" vermischt wurden - siehe Fußnoten-Punkt unten).
  - Stärken-Überschrift von "Hier seid ihr als Team bereits stark" auf "Hier nimmst du
    euer Team bereits als stark wahr" umgestellt - macht explizit, dass eine
    Einzelperson bewertet (nicht das Team selbst antwortet), UND dass das Team der
    Bewertungsgegenstand ist (keine reine Selbsteinschätzung). Vorher wirkte "ihr als
    Team" wie ein Widerspruch zur Fußnote "ausschließlich deine eigenen Antworten" -
    tatsächlich kein Widerspruch (unterschiedliche Aussage: Urheberschaft vs.
    Bewertungsgegenstand), aber uneindeutig formuliert.
  - Stärken-Erläuterungstext ersetzt: alter Text ("Die drei Zellen mit dem geringsten
    Abstand...") stimmte seit v1.18 nicht mehr mit der Befundtyp-Logik überein und
    versprach immer drei Zellen, obwohl "Belastbare Stärke" beide Bedingungen
    gleichzeitig braucht (Verhalten >= 4,0 UND Verankerung >= 4) und dadurch oft
    weniger als drei Treffer liefert (Simulation mit 200 zufälligen Durchläufen:
    median 1 Treffer, nur 4,5% der Faelle liefern alle drei). Neuer Text benennt beide
    Kriterien UND dass weniger als drei normal ist.
  - Analog: Potenzialpunkte-Erläuterungstext war bereits in v1.19 korrigiert worden
    (siehe dort), Stärken-Text war dabei übersehen worden - jetzt nachgezogen.
  - Fußnote aus dem globalen Seitenrahmen entfernt (war zuvor auf jeder Seite
    sichtbar, inkl. Start-, Fragebogen- und Dankseite) und auf reine Marken-/
    Versionszeile gekürzt, nur noch innerhalb der Ergebnisseite. Der inhaltliche Teil
    ("teamweite Auswertung entsteht erst durch die Beratung") ist in den
    Ergebnisseiten-Einleitungssatz gewandert (siehe oben) statt ersatzlos zu
    entfallen.
  - Dankseite: neue Wertschätzung-Eröffnung vor dem bisherigen Text ("Danke, dass du
    dir die Zeit genommen hast...") sowie "Nächste Schritte"-Absatz, der den PDF-/

  - Potenzial-Bereich: Quick Win, Fragile Staerke UND Aufbauthema konkurrieren nach

  - Befundtyp erscheint sichtbar im Eyebrow der Potenzialpunkt-Karte (z. B.

  - Zellen ohne beantwortetes Fragetyp-4-Item bleiben unklassifiziert und fliessen nicht

<style>

const WERTE = Object.keys(DATA);

function cellOf(w, f){ return DATA[w][f]; }

const VERANKERUNG_LABELS = ["nicht vorhanden","kaum bekannt","selten angewendet","regelmäßig angewendet","konsequent angewendet"];

function scaleRow(itemNum, value, isVerankerung){
  let html = `<div class="scale-row ${isVerankerung?'scale-row-verankerung':''}" data-item="${itemNum}">`;
  for(let v=1; v<=5; v++){
    if(isVerankerung){
      const label = VERANKERUNG_LABELS[v-1].replace(' ', '<br>');
      html += `<div class="scale-btn scale-btn-labeled ${value===v?'sel':''}" data-v="${v}"><div class="sb-num">${v}</div><div class="sb-label">${label}</div></div>`;
    } else {
      html += `<div class="scale-btn ${value===v?'sel':''}" data-v="${v}">${v}</div>`;
    }
  }
  html += `<div class="scale-btn scale-btn-nb ${value==='nb'?'sel':''} ${isVerankerung?'scale-btn-labeled':''}" data-v="nb">n.b.</div>`;
  html += `</div>`;
  if(!isVerankerung){
    html += `<div class="scale-caption"><span class="sc-txt">1 · fast nie</span><span class="sc-txt">3 · teilweise</span><span class="sc-txt">5 · fast immer</span><span class="sc-spacer"></span></div>`;
  }
  return html;
}

const AUSNAHME_FELD = "Ausnahmesituationen";
const AUSNAHME_HINWEIS = "Urteile in diesem Feld beruhen eher auf einzelnen erinnerten Vorfällen als auf beobachtbarer Häufigkeit — als zusätzlicher Diagnosehinweis zu lesen, nicht als härtere Kennzahl.";

// Verankerungs-Kategorie (Fragetyp 4, kategorial statt Mittelwert — Handbuch v1.7):
// 1 = Strukturlücke, 2–3 = Umsetzungslücke, 4–5 = verankert.
const VERANKERUNG_KONTEXT = {
  "Strukturlücke": "Es gibt keine Regelung, die hier unterstützen könnte.",
  "Umsetzungslücke": "Eine Regelung existiert, ist aber kaum bekannt oder wird selten angewendet.",
  "verankert": "Eine Regelung existiert und wird im Alltag angewendet."
};
function verankerungsKategorie(v){
  if(v === 'nb' || v === undefined || v === null) return null;
  if(v === 1) return 'Strukturlücke';
  if(v === 2 || v === 3) return 'Umsetzungslücke';
  return 'verankert'; // 4 oder 5
}

function computeCellAmpel(q1, q2, q3raw, feld){
  // "nicht beurteilbar" (Wert 'nb') fließt nicht numerisch in den Mittelwert ein.
  const raw = [q1, q2, q3raw];
  const validIdx = raw.map((v,i) => v !== 'nb' && v !== undefined ? i : -1).filter(i => i >= 0);

  if(validIdx.length < 2){
    return { avg:null, ampel:'neutral', label:'Nicht auswertbar', notEvaluable:true, kritischerHinweis:false };
  }

  const values = validIdx.map(i => i === 2 ? (6 - raw[2]) : raw[i]); // Reverse-Item (Index 2) invertieren
  const avg = values.reduce((a,b)=>a+b,0) / values.length;

  // Einheitliche Ampellogik für ALLE Felder (Handbuch v1.6/v1.7) — ersetzt die frühere
  // zweistufige Sonderregel für Ausnahmesituationen. Ampel hängt ausschließlich vom
  // Mittelwert ab (>=4,0 Grün, 2,5 bis unter 4,0 Gelb, <2,5 Rot) — keine Streuungsregel.
  let ampel, label;
  if(avg >= 4.0){ ampel='green'; label='Match'; }
  else if(avg >= 2.5){ ampel='amber'; label='Gap'; }
  else { ampel='red'; label='Mismatch'; }

  // Warnsignal Ausnahmesituationen — Variante C (entschieden): Mittelwert < 3,5 UND
  // mindestens 2 von 3 Verhaltensitems (nach Reverse-Umkodierung) unter der Schwelle.
  // Verhindert, dass ein einzelner Ausreißer allein das Signal trägt (Variante A).
  const anzahlUnterSchwelle = values.filter(v => v < 3.5).length;
  const kritischerHinweis = (feld === AUSNAHME_FELD) && (avg < 3.5) && (anzahlUnterSchwelle >= 2);
  return { avg, ampel, label, notEvaluable:false, kritischerHinweis };
}

function render(){
  if(stage === 'intro') return renderIntro();
  if(stage === 'survey') return renderSurveyPage();

}

function renderSurveyPage(){

  const BEZUG_HINWEIS = {

  document.querySelectorAll('.scale-btn').forEach(btn => {

      render();
    };
  });

  const teamInput = document.getElementById('teamInput');
  if(teamInput){ teamInput.oninput = (e) => { team = e.target.value; }; }

  document.getElementById('btnBack').onclick = () => { if(!isFirst){ currentWertIdx--; render(); } };

      document.getElementById('surveyBanner').innerHTML = `<div class="banner err">Bitte alle Fragen in diesem Abschnitt beantworten.</div>`;

}

function prepareResults(){
  const all = [];
  WERTE.forEach(w => {
    FELDER.forEach(f => {
      const cell = cellOf(w, f);
      const [n1,n2,n3,n4] = cell.items;
      const q1 = answers[n1], q2 = answers[n2], q3raw = answers[n3], q4 = answers[n4];
      const r = computeCellAmpel(q1, q2, q3raw, f);
      const invQ3 = q3raw === 'nb' ? null : 6 - q3raw;
      all.push({
        wert:w, feld:f, ...r,
        q1, q2, q3raw, invQ3, q4,
        n1, n2, n3, n4,
        text1: cell.q[0], text2: cell.q[1], text3: cell.q[2], text4: cell.q[3]
      });
    });
  });
  const evaluable = all.filter(c => !c.notEvaluable);

  // Befundtyp-Klassifizierung (Handbuch v1.7 Kap. 6.5, Arbeitstabelle Blatt "Befundmuster"):
  // Verhalten (Mittelwert Fragetyp 1-3) x Verankerung (Fragetyp 4, binaer >=4 vs. <=3).
  // Ersetzt die vorherige reine Mittelwert-Sortierung - vermeidet, dass ein teures
  // Aufbauthema vor einem wirkungsvolleren Quick Win landet, nur weil dessen Mittelwert
  // niedriger ist. Faelle ohne beantwortetes Fragetyp-4-Item bleiben unklassifiziert und
  // fliessen nicht in Potenzial-/Staerken-Auswahl ein (keine Klassifizierung ohne Datenbasis).
  function classifyBefundtyp(avg, q4){
    if(q4 === 'nb' || q4 === undefined || q4 === null) return null;
    const verankertHoch = q4 >= 4;
    if(avg >= 4.0){ return verankertHoch ? 'Belastbare Stärke' : 'Fragile Stärke'; }
    return verankertHoch ? 'Quick Win' : 'Aufbauthema';
  }
  // Prioritaet ohne Fuehrungsluecke (bewusst nicht Teil dieses Release, siehe Diskussion):
  // 1=Quick Win, 2=Fragile Staerke (sichern), 3=Aufbauthema, 4=Belastbare Staerke.
  const PRIO = { 'Quick Win':1, 'Fragile Stärke':2, 'Aufbauthema':3, 'Belastbare Stärke':4 };

  const classified = evaluable
    .map(c => ({ ...c, befundtyp: classifyBefundtyp(c.avg, c.q4) }))
    .filter(c => c.befundtyp !== null);

  // Potenzial-Bereich: Quick Win, Fragile Staerke UND Aufbauthema konkurrieren nach
  // Prioritaet um die 3 Plaetze - "Fragile Staerke" traegt Handlungscharakter ("sichern")
  // und gehoert deshalb hierhin, nicht in den reinen Bestaetigungs-Staerken-Bereich
  // (Handbuch: "nicht als gesicherte Staerke berichten").
  gapCells = classified
    .filter(c => c.befundtyp !== 'Belastbare Stärke')
    .sort((a,b) => (PRIO[a.befundtyp] - PRIO[b.befundtyp]) || (a.avg - b.avg))
    .slice(0, 3);
  gapCells.forEach(c => { const key = c.wert+'||'+c.feld; if(!(key in actionTexts)) actionTexts[key] = ''; });

  // Staerken-Bereich: ausschliesslich "Belastbare Staerke" (Verhalten >=4,0 UND Verankerung >=4).
  strengthCells = classified
    .filter(c => c.befundtyp === 'Belastbare Stärke')
    .sort((a,b) => b.avg - a.avg)
    .slice(0, 3);

  // "nicht beurteilbar"-Anteil über den gesamten Fragebogen (Fragetyp 1-3, 45 Items)
  const alleVerhaltensAntworten = WERTE.flatMap(w => FELDER.flatMap(f => cellOf(w,f).items.slice(0,3).map(n => answers[n])));
  const nbAnzahl = alleVerhaltensAntworten.filter(v => v === 'nb').length;
  nbAnteil = alleVerhaltensAntworten.length ? nbAnzahl / alleVerhaltensAntworten.length : 0;
}

function extremeKeys(c, mode){
  const parts = [
    { key:'q1', value:c.q1 },
    { key:'q2', value:c.q2 },
    { key:'invq3', value:c.invQ3 }
  ].filter(p => p.value !== 'nb' && p.value !== null);
  if(parts.length === 0) return [];
  const target = mode === 'max' ? Math.max(...parts.map(p => p.value)) : Math.min(...parts.map(p => p.value));
  return parts.filter(p => p.value === target).map(p => p.key);
}

function renderBreakdown(c, mode='min'){
  const keys = extremeKeys(c, mode);
  const highlightClass = mode === 'max' ? 'bd-strong' : 'bd-weak';
  const rows = [
    { key:'q1', val:c.q1, text:c.text1, num:c.n1, revNote:null },
    { key:'q2', val:c.q2, text:c.text2, num:c.n2, revNote:null },
    { key:'invq3', val:c.invQ3, text:c.text3, num:c.n3, revNote: c.q3raw === 'nb' ? null : `Ursprüngliche Antwort: ${c.q3raw}/5 — hier umgekehrt betrachtet, weil die Frage gegenteilig formuliert war.` }
  ].map(row => {
    const isHighlight = keys.includes(row.key);
    const isNb = row.val === 'nb' || row.val === null;
    // Fragetyp-2-Hinweis: nur an der eigenen Zeile, nur wenn Fragetyp 2 zu den
    // hervorgehobenen (schwächsten) Items dieser Zelle gehört — analog zur
    // Reverse-Item-Zusatzerklärung, die auch nur an ihrer eigenen Zeile steht.
    const note = (row.key === 'q2' && isHighlight && mode === 'min') ? FT2_HINWEIS : row.revNote;
    return `
      <div class="bd-row ${isHighlight?highlightClass:''}">
        <div class="bd-top">
          <span class="bd-qtext-main"><b>Frage ${row.num}</b> — „${row.text}"</span>
          <span class="bd-val">${isNb ? 'n.b.' : row.val+'/5'}</span>
        </div>
        ${note ? `<div class="bd-rawnote">${note}</div>` : ''}
      </div>`;
  }).join('');

  // Fragetyp 4 (Organisatorische Verankerung): kein Teil des Mittelwerts/der Ampel,
  // deshalb eigene Zeile ohne Hervorhebungslogik und ohne Methodik-Jargon für
  // Teilnehmende. Struktur-Einordnung erscheint bei JEDER Zelle (unabhängig vom Feld) —
  // die Kategorie (Strukturlücke/Umsetzungslücke/verankert) ist nicht auf
  // Ausnahmesituationen beschränkt, sondern eine allgemeine Einordnung von Fragetyp 4.
  const vk = verankerungsKategorie(c.q4);
  const isQ4Nb = c.q4 === 'nb' || c.q4 === undefined;
  const strukturNote = vk ? `<div class="bd-rawnote"><b>Struktur:</b> ${vk} — ${VERANKERUNG_KONTEXT[vk]}</div>` : '';
  const q4Row = `
      <div class="bd-row">
        <div class="bd-top">
          <span class="bd-qtext-main"><b>Frage ${c.n4}</b> — „${c.text4}"</span>
          <span class="bd-val">${isQ4Nb ? 'n.b.' : c.q4+'/5'}</span>
        </div>
        ${strukturNote}
      </div>`;

  return `
    <div class="breakdown">
      <div class="breakdown-title">Woraus setzt sich diese Bewertung zusammen?</div>
      ${rows}
      ${q4Row}
    </div>`;
}

// Ausnahmesituationen-Hinweis als Dropdown (standardmäßig eingeklappt) — verpflichtender
// Diagnosehinweis bleibt Bestandteil des Berichts, steht aber ab v1.16 abrufbar statt
// dauerhaft im Fließtext (angepasste GESETZT-Regel, siehe Auswertungslogik Abschnitt 6).
// Einheitlich bei Potenzialpunkten UND Stärken, wo immer kritischerHinweis zutrifft.
function renderAusnahmeToggle(id){
  return `
    <div class="ausnahme-toggle" data-id="${id}">⚠ Hinweis zu diesem Feld anzeigen</div>
    <div class="ausnahme-details" id="ausnahmeDetails${id}" style="display:none;">
      <div class="special-note">⚠ ${AUSNAHME_HINWEIS} Realitätscheck vor der Maßnahme: wiederkehrender Fall oder Einzelvorfall?</div>
    </div>`;
}

function ampelBadgeClass(ampel){
  if(ampel === 'neutral') return ampel;
  return ampel === 'red' ? 'red' : (ampel === 'amber' ? 'amber' : 'green');
}
function ampelCardClass(ampel){
  if(ampel === 'neutral') return ampel;
  return ampel === 'green' ? 'green' : (ampel === 'amber' ? 'amber' : '');
}

function renderFullAnswersBlock(){
  const sections = WERTE.map(w => {
    const fields = FELDER.map(f => {
      const cell = cellOf(w, f);
      const rows = cell.items.map((itemNum, i) => `
        <div class="fa-row">
          <span class="fa-num">${itemNum}</span>
          <span class="fa-qtext">„${cell.q[i]}"</span>
          <span class="fa-val">${answers[itemNum] === 'nb' ? 'n.b.' : (answers[itemNum] !== undefined ? answers[itemNum]+'/5' : '–/5')}</span>
        </div>`).join('');
      const note = f === AUSNAHME_FELD ? `<div class="bd-rawnote" style="margin-bottom:6px;">${AUSNAHME_HINWEIS}</div>` : '';
      return `<div class="fa-field"><div class="fa-field-title">${f}</div>${note}${rows}</div>`;
    }).join('');
    return `<div class="fa-wert"><div class="fa-wert-title">${w}</div>${fields}</div>`;
  }).join('');

  return `
    <div class="print-only full-answers">
      <div class="matrix-caption">Deine vollständigen Antworten (alle 60 Fragen)</div>
      ${sections}
    </div>`;
}

function computeMatrixRowsHtml(){
  return WERTE.map(w => {
    const cells = FELDER.map(f => {
      const cell = cellOf(w, f);
      const [n1,n2,n3] = cell.items;
      const r = computeCellAmpel(answers[n1], answers[n2], answers[n3], f);
      const sub = r.notEvaluable ? '(zu wenig Antworten)' : `Ø ${r.avg.toFixed(2)}`;
      const warn = r.kritischerHinweis ? ' ⚠' : '';
      return `<td class="cell-ampel bg-${r.ampel}"><div class="cell-inner">${r.label}${warn}<div class="sub">${sub}</div></div></td>`;
    }).join('');
    return `<tr><td class="wert-lbl">${w}</td>${cells}</tr>`;
  }).join('');
}

function computeStrengthCardsHtml(){
  return strengthCells.map((c, idx) => {
    return `
      <div class="gap-card ${ampelCardClass(c.ampel)} strength-slim strength-compact">
        <div class="strength-row">
          <span class="strength-label">Stärke ${idx+1}</span>
          <span class="strength-title">${c.wert} — ${c.feld}</span>
          <span class="gap-badge ${ampelBadgeClass(c.ampel)}">${c.label} · Ø ${c.avg.toFixed(2)}</span>
        </div>
        ${c.kritischerHinweis ? renderAusnahmeToggle('str'+idx) : ''}
        <div class="strength-toggle" data-idx="${idx}">Details anzeigen</div>
        <div class="strength-details" id="strengthDetails${idx}" style="display:none;">
          ${renderBreakdown(c, 'max')}
        </div>
      </div>`;
  }).join('');
}

// printMode=false: interaktives Textfeld (Ergebnis-Seite). printMode=true: statischer Text
// aus actionTexts, kein Eingabefeld (Danke-Seite / Druck-Report).
function computeGapCardsHtml(printMode){
  return gapCells.map((c, idx) => {
    const key = c.wert+'||'+c.feld;
    const anr = MASSNAHME_ANREGUNG[c.feld];
    const massnahmeBlock = printMode
      ? `<div class="gap-action-print">${actionTexts[key] || '(keine Maßnahme eingetragen)'}</div>`
      : `<div class="ta-wrap"><textarea class="gap-textarea" data-key="${key}" placeholder="z. B. Ich spreche in unserem nächsten Teammeeting offen an, dass...">${actionTexts[key] || ''}</textarea></div>`;
    return `
      <div class="gap-card ${ampelCardClass(c.ampel)}">
        <div class="gap-eyebrow">Potenzialpunkt ${idx+1} · ${c.befundtyp}</div>
        <div class="gap-title">${c.wert}</div>
        <div class="gap-sub">${c.feld}</div>
        <span class="gap-badge ${ampelBadgeClass(c.ampel)}">${c.label} · Ø ${c.avg.toFixed(2)}</span>
        ${c.kritischerHinweis ? renderAusnahmeToggle('gap'+idx) : ''}
        ${renderBreakdown(c, 'min')}
        <div class="gap-prompt">
          Eine Kultur trägt nie eine einzelne Person allein — aber jede:r kann etwas dazu beitragen, dass es sich für alle spürbar verändert.
          <span class="small">Genau darum geht es bei der Maßnahme und jeder ist ein Teil des Gesamten — konkret für die kommenden 6 Wochen:</span>
        </div>
        ${anr ? `
        <div class="anregung-box">
          <div class="anregung-item"><span class="anregung-label">Eigenes Verhalten:</span> ${anr.eigen}</div>
          <div class="anregung-item"><span class="anregung-label">Team ansprechen:</span> ${anr.team}</div>
        </div>` : ''}
        ${massnahmeBlock}
      </div>`;
  }).join('');
}

function renderResults(){
  const view = document.getElementById('surveyView');

  const matrixRows = computeMatrixRowsHtml();
  const strengthCardsHtml = computeStrengthCardsHtml();
  const gapCardsHtml = computeGapCardsHtml(false);

  view.innerHTML = `
    <div class="card">
      <h2 class="section-h">Dein Ergebnis</h2>
      <div class="intro" style="max-width:100%;">Das ist deine persönliche Wert-Verhalten-Landkarte, basierend auf deinen eigenen Antworten. Eine teamweite, aggregierte Auswertung entsteht erst, wenn deine Beratung die heruntergeladenen Einzelergebnisse zusammenführt.</div>

      <div class="matrix-caption">Deine Matrix</div>
      <table class="dash-matrix">
        <thead><tr><th>Wert</th><th>Alltag &amp; Routinen</th><th>Ausnahmesituationen</th><th>Kunden &amp; Markt</th></tr></thead>
        <tbody>${matrixRows}</tbody>
      </table>
      <div class="matrix-footnote">⚠ = kritischer Hinweis in Ausnahmesituationen (Ø unter 3,5 UND mindestens 2 von 3 Items darunter): ${AUSNAHME_HINWEIS}</div>
      <div class="matrix-footnote">"Zu wenig Antworten" erscheint, wenn weniger als 2 von 3 Verhaltensitems einer Zelle beantwortet wurden.</div>
      ${nbAnteil > 0.3 ? `<div class="banner err" style="margin-top:8px;">Eingeschränkte Aussagekraft: ${Math.round(nbAnteil*100)}% deiner Antworten waren „nicht beurteilbar".</div>` : ''}

      <div class="matrix-caption">Hier nimmst du euer Team bereits als stark wahr</div>
      <div class="intro" style="max-width:100%; margin-top:0;">Hier sind deine am stärksten bewerteten Zellen — belastbare Stärken. Das zeigt sich durch zwei Dinge gleichzeitig: eine Verhaltensbewertung ab 4 und ein Format, das regelmäßig oder konsequent angewendet wird. Es können deshalb auch weniger als drei sein.</div>
      <div class="strength-grid">${strengthCardsHtml}</div>

      <div class="matrix-caption">Deine größten Potenzialpunkte</div>
      <div class="intro" style="max-width:100%; margin-top:0;">Hier stehen nicht zwangsläufig die niedrigsten Werte, sondern die mit dem größten Hebel: Wo es bereits ein Format oder eine Regelung gibt, die nur zu selten genutzt wird, lässt sich schnell etwas verändern. Wo eine solche Grundlage komplett fehlt, dauert der Aufbau länger und eher ein Thema für das gesamte Team.</div>
      <div class="intro" style="max-width:100%; margin-top:6px; font-weight:600; color:var(--navy);">Jetzt geht's um dich: Was willst du hier konkret verändern?</div>
      ${gapCardsHtml}

      <div class="intro" style="max-width:100%; margin-top:20px; font-weight:600; color:var(--navy);">Wenn du fertig bist: Trage deine Maßnahmen oben ein, dann schließe ab. PDF/Druck gibt es im letzten Schritt, mit allem zusammen.</div>

      <div id="resultsBanner"></div>
      <div class="nav-row">
        <div class="nav-btn primary" id="btnSaveActions">Ergebnis abschließen &amp; als Datei herunterladen</div>
      </div>
    </div>`;

  document.querySelectorAll('.gap-textarea').forEach(ta => {
    ta.oninput = (e) => { actionTexts[e.target.dataset.key] = e.target.value; };
  });

  document.querySelectorAll('.strength-toggle').forEach(btn => {
    btn.onclick = () => {
      const idx = btn.dataset.idx;
      const details = document.getElementById('strengthDetails'+idx);
      const isHidden = details.style.display === 'none';
      details.style.display = isHidden ? 'block' : 'none';
      btn.textContent = isHidden ? 'Details verbergen' : 'Details anzeigen';
    };
  });

  document.querySelectorAll('.ausnahme-toggle').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      const details = document.getElementById('ausnahmeDetails'+id);
      const isHidden = details.style.display === 'none';
      details.style.display = isHidden ? 'block' : 'none';
      btn.textContent = isHidden ? '⚠ Hinweis verbergen' : '⚠ Hinweis zu diesem Feld anzeigen';
    };
  });

  document.getElementById('btnSaveActions').onclick = () => {
    finishAndExport();
  };
}

function buildPayload(){
  const actions = gapCells.map(c => ({
    wert: c.wert, feld: c.feld, ampel: c.ampel, avg: c.avg,
    action: actionTexts[c.wert+'||'+c.feld] || ''
  }));
  return { tool: 'BAM Deep Dive', version: 'Teilnehmerversion 1.20', answers, team: team || null, ts: Date.now(), actions };
}

// Diese Seite läuft rein im Browser (z. B. als statische GitHub-Pages-Seite) und hat keinen
// eigenen Server im Hintergrund. Antworten werden deshalb NICHT automatisch irgendwohin
// übertragen — die teilnehmende Person lädt ihr Ergebnis selbst als Datei herunter und
// gibt sie wie mit dem/der Berater:in vereinbart weiter (z. B. per E-Mail oder Upload).
function finishAndExport(){
  const banner = document.getElementById('resultsBanner');
  try{
    const payload = buildPayload();
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date(payload.ts).toISOString().slice(0,16).replace(/[:T]/g,'-');
    a.href = url;
    a.download = `bam-antwort_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    stage = 'done';
    render();
  } catch(err){
    banner.innerHTML = `<div class="banner err">Fehler beim Erstellen der Ergebnisdatei: ${err.message || err}. Bitte erneut versuchen oder stattdessen "Als PDF speichern/drucken" nutzen.</div>`;
  }
}

function renderDone(){
  const view = document.getElementById('surveyView');
  const recap = gapCells.map(c => {
    const key = c.wert+'||'+c.feld;
    const action = actionTexts[key] || '(keine Maßnahme eingetragen)';
    return `
      <div class="recap-item">
        <div class="rc-cell">${c.wert} — ${c.feld}</div>
        <div class="rc-action">${action}</div>
      </div>`;
  }).join('');

  const matrixRows = computeMatrixRowsHtml();
  const strengthCardsHtml = computeStrengthCardsHtml();
  const gapCardsHtmlPrint = computeGapCardsHtml(true);

  view.innerHTML = `
    <div class="card thanks">
      <h2>Danke!</h2>
      <p style="text-align:left; margin-top:14px;">Danke, dass du dir die Zeit genommen hast. Der erste Schritt ist getan — jetzt braucht das Team deinen Beitrag, damit die vereinbarten Werte noch spürbarer und wirksamer werden.</p>
      <p style="text-align:left; margin-top:14px;"><b>Nächste Schritte:</b> Speichere dir diese Seite als PDF oder drucke sie aus — dort findest du auch deine Matrix, Stärken und Potenzialpunkte mit deinen eingetragenen Maßnahmen. Deine Antworten wurden zusätzlich als Datei heruntergeladen (Ordner „Downloads"). Bitte gib diese Datei wie mit deiner Beratung vereinbart weiter — z. B. per E-Mail oder Upload.</p>
      <p style="text-align:left; margin-top:14px;">Das hast du dir für die kommenden 6 Wochen vorgenommen:</p>
      ${recap}

      <div class="checkin-box">
        <div class="checkin-title">In 6 Wochen</div>
        <div class="checkin-text">Trag dir jetzt einen Termin ein, um ehrlich draufzuschauen, ob sich etwas verändert hat:</div>
        <div class="checkin-q">Ist die Maßnahme umgesetzt? (Ja / Teilweise / Nein)</div>
        <div class="checkin-q">Hat sich das Verhalten im Alltag spürbar verändert? (Ja / Teilweise / Nein)</div>
        <div class="checkin-q">Weiter mit dem nächsten Punkt — oder braucht dieser noch einen neuen Impuls?</div>
      </div>

      <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
        <div class="nav-btn" id="btnPrintDone">Als PDF speichern / drucken</div>
        <div class="nav-btn primary" id="btnAnother">Weitere Teilnahme erfassen</div>
      </div>

      <div class="print-only report-cover print-report-start" style="margin-top:24px;">
        <p class="report-meta">Team/Bereich: ${team || '–'} · Datum: ${new Date().toLocaleDateString('de-DE')}</p>
        <p style="margin-top:8px;"><b>Anonymität &amp; Datenschutz:</b> Deine Daten wurden anonym behandelt und ausgewertet — es wurden weder Name noch E-Mail-Adresse erfasst, es gab keine Anmeldung. Diese Seite lief vollständig in deinem Browser, es gibt keinen Server im Hintergrund.</p>
      </div>

      <div class="print-only">
        <h2 class="section-h" style="margin-top:20px;">Dein Ergebnis</h2>
        <div class="matrix-caption">Deine Matrix</div>
        <table class="dash-matrix">
          <thead><tr><th>Wert</th><th>Alltag &amp; Routinen</th><th>Ausnahmesituationen</th><th>Kunden &amp; Markt</th></tr></thead>
          <tbody>${matrixRows}</tbody>
        </table>
        <div class="matrix-footnote">⚠ = kritischer Hinweis in Ausnahmesituationen (Ø unter 3,5 UND mindestens 2 von 3 Items darunter): ${AUSNAHME_HINWEIS}</div>
        <div class="matrix-footnote">"Zu wenig Antworten" erscheint, wenn weniger als 2 von 3 Verhaltensitems einer Zelle beantwortet wurden.</div>

        <div class="matrix-caption">Hier nimmst du euer Team bereits als stark wahr</div>
        <div class="strength-grid">${strengthCardsHtml}</div>

        <div class="matrix-caption">Deine größten Potenzialpunkte</div>
        ${gapCardsHtmlPrint}
      </div>

      ${renderFullAnswersBlock()}
      <div class="footnote">MindnessConsult · BAM — Behavior Alignment Matrix · Teilnehmerversion 1.20 · Fragenkatalog v4: 5 Kernwerte, 60 Basisfragen</div>
    </div>`;
  document.getElementById('btnPrintDone').onclick = () => { window.print(); };
  document.getElementById('btnAnother').onclick = () => {
    answers = {}; team=''; currentWertIdx=0; actionTexts={}; gapCells=[]; strengthCells=[]; nbAnteil=0; stage='intro'; render();
  };
}

render();
</script>
